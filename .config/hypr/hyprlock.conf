general {
    hide_cursor = true
}

background {
    monitor =
    path = #screenshot
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 1
}

label {
    monitor =
    text = $TIME :) #$USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.6)
    inner_color = rgba(0, 0, 0, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>password</i>
    hide_input = false
    check_color = rgba(120, 180, 255, 1.0)
    fail_color = rgba(255, 80, 80, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(255, 200, 80, 1.0)
    position = 0, -80
    halign = center
    valign = center
}
